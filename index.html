<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English Communication & Grammar Mastery</title>
<style>
  :root{
    --pink:#EE3A63; --pink-dark:#D62753;
    --green:#3FAE5C; --green-dark:#329049;
    --blue-select:#95A2E9; --blue-select-dark:#6E7DDD;
    --teal-correct:#1B5E4F; --green-correct-text:#3FDE7A;
    --tooltip-blue:#4C7EEF;
    --ink:#2c2c34; --gray:#8a8a94; --line:#e4e4ea;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);}

  .sound-toggle{position:fixed;top:14px;right:14px;z-index:100;border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .sound-toggle:hover{border-color:var(--pink);}
  .stage{position:relative;min-height:100vh;max-width:980px;margin:0 auto;background:#fff;}

  .app-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);}
  .app-nav .back{color:var(--pink);font-weight:700;text-decoration:none;font-size:13px;letter-spacing:.03em;cursor:pointer;}
  .app-nav .links{display:flex;gap:28px;font-size:13px;color:#55555f;font-weight:600;}
  .app-nav .links span{cursor:pointer;padding-bottom:4px;border-bottom:2px solid transparent;transition:.15s;}
  .app-nav .links span:hover{color:var(--pink);}
  .app-nav .links span.active{color:var(--pink);border-bottom-color:var(--pink);font-weight:800;}
  .btn-outline{cursor:pointer;transition:.15s;}
  .btn-outline.bookmarked{background:var(--pink);color:#fff;}
  .link-text{color:var(--pink);cursor:pointer;text-decoration:underline;}
  .toast-overlay{position:fixed;inset:0;background:rgba(20,20,26,.4);display:flex;align-items:center;justify-content:center;z-index:60;}
  .toast-card{background:#fff;border-radius:10px;width:340px;max-width:90%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;text-align:center;}
  .toast-card .sc-close{position:absolute;right:14px;top:14px;cursor:pointer;color:#999;font-size:16px;}
  .toast-card .toast-icon{font-size:28px;margin-bottom:8px;}
  .toast-card h3{margin:0 0 8px;color:var(--pink);font-size:16px;font-weight:800;}
  .toast-card p{margin:0;font-size:13px;line-height:1.55;color:#444;}
  .summaries-card{background:#fff;border-radius:10px;width:420px;max-width:92%;max-height:80vh;overflow-y:auto;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;text-align:left;}
  .summaries-card .sc-close{position:absolute;right:16px;top:16px;cursor:pointer;color:#999;font-size:18px;z-index:2;}
  .res-header{padding:20px 24px 16px;text-align:center;border-bottom:1px solid var(--line);}
  .res-header h3{margin:0;color:var(--ink);font-size:19px;font-weight:700;font-family:Georgia,'Times New Roman',serif;}
  .summaries-body{padding:20px 24px 24px;}
  .summaries-body h4{margin:0 0 16px;font-size:17px;font-weight:800;color:var(--ink);}
  .pdf-list{display:flex;flex-direction:column;gap:16px;}
  .pdf-item{display:flex;align-items:center;gap:14px;cursor:pointer;padding:6px;border-radius:8px;transition:background .15s;}
  .pdf-item:hover{background:#fbeef1;}
  .pdf-icon{width:42px;height:42px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;flex:none;}
  .pdf-icon svg{width:19px;height:19px;fill:#fff;}
  .pdf-caption{font-size:11.5px;color:#8a8a94;line-height:1.4;}
  .pdf-title{font-size:13.5px;font-weight:800;color:var(--pink);line-height:1.35;}
  .app-nav .avatar{width:30px;height:30px;border-radius:50%;background:var(--pink-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}

  .course-wrap{display:flex;gap:32px;padding:24px 28px 40px;}
  .course-main{flex:1;}
  .course-icon{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#ec4899,#f59e0b,#22c55e,#8b5cf6);margin-bottom:16px;}
  .course-title{font-size:24px;font-weight:800;letter-spacing:.01em;margin:0 0 14px;line-height:1.2;}
  .eyebrow{font-size:10px;letter-spacing:.12em;color:var(--gray);font-weight:700;margin-bottom:6px;}
  .course-desc{font-size:14.5px;line-height:1.55;color:#3d3d46;max-width:520px;}
  .start-row{margin-top:22px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:14px 20px;max-width:520px;}
  .btn-green{background:var(--green);color:#fff;border:none;padding:10px 20px;border-radius:5px;font-weight:700;font-size:12.5px;letter-spacing:.03em;cursor:pointer;}
  .btn-green:hover{background:var(--green-dark);}
  .side-card{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px;width:220px;}
  .side-card h4{font-size:11px;letter-spacing:.05em;margin:0 0 10px;color:#222;}
  .bookmark-card{border-color:var(--pink);}
  .bookmark-card .btn-outline{width:100%;border:1px solid var(--pink);color:var(--pink);background:#fff;padding:8px;border-radius:4px;font-weight:700;font-size:11px;letter-spacing:.03em;}
  .side-card ul{margin:0;padding-left:16px;font-size:12px;color:#3d3d46;line-height:1.5;}
  .pdf-list-inline{display:flex;flex-direction:column;gap:12px;}
  .pdf-item-sm{display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:4px;border-radius:6px;transition:background .15s;}
  .pdf-item-sm:hover{background:#fbeef1;}
  .pdf-icon-sm{width:26px;height:26px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;}
  .pdf-icon-sm svg{width:12px;height:12px;fill:#fff;}
  .pdf-caption-sm{font-size:9.5px;color:#8a8a94;line-height:1.3;}
  .pdf-title-sm{font-size:11px;font-weight:800;color:var(--pink);line-height:1.3;}
  .chapter-block{max-width:640px;margin-top:26px;border-top:1px solid var(--line);padding-top:18px;}
  .chapter-head{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);font-weight:700;letter-spacing:.04em;margin-bottom:4px;}
  .chapter-name{font-size:15px;font-weight:800;color:var(--pink);margin-bottom:14px;letter-spacing:.02em;}
  .lesson-row{border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:16px;}
  .lesson-row.done{background:#fef6f8;border-color:#f6d7e0;}
  .lesson-status-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;}
  .status-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
  .status-badge.done{background:var(--pink);color:#fff;}
  .status-badge.available{background:#fff;border:1.5px solid var(--green);color:var(--green);}
  .stats-bar{display:flex;align-items:center;gap:14px;padding:10px 28px;background:#fdf7f9;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .stat-chip{font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 12px;white-space:nowrap;}
  .stat-chip.streak{color:#c85a00;}
  .stat-chip.xp{color:var(--pink-dark);}
  .xp-bar-wrap{flex:1;min-width:100px;max-width:220px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--pink),#ff8fb0);border-radius:4px;transition:width .3s;}
  .milestone-card{display:flex;align-items:center;gap:14px;border:1px dashed #c9b8ec;background:#f8f5fd;border-radius:6px;padding:14px 18px;margin-bottom:12px;}
  .milestone-card.passed{border:1px solid #cdeedb;background:#f7fdf9;}
  .milestone-card.final{border:1.5px dashed #e0ac2b;background:#fdf6e3;}
  .milestone-card.final.passed{border:1.5px solid #cdeedb;background:#f7fdf9;}
  .milestone-flag{font-size:22px;}
  .milestone-info{flex:1;}
  .milestone-title{font-weight:800;font-size:13.5px;color:#5b3fa8;}
  .milestone-card.final .milestone-title{color:#a3760f;}
  .milestone-card.passed .milestone-title{color:var(--green-dark);}
  .milestone-sub{font-size:11.5px;color:var(--gray);margin-top:2px;}
  .lesson-row .lesson-eyebrow{font-size:10px;color:var(--gray);letter-spacing:.06em;font-weight:700;}
  .lesson-row h5{margin:2px 0 6px;font-size:14px;font-weight:800;}
  .lesson-row ul{margin:0;padding-left:16px;font-size:12px;color:#4a4a52;line-height:1.5;}
  .btn-start{background:var(--green);color:#fff;border:none;padding:8px 22px;border-radius:4px;font-weight:700;font-size:11.5px;cursor:pointer;white-space:nowrap;}
  .btn-start.review{background:var(--pink);color:#fff;border:none;}
  .btn-start.review:hover{background:var(--pink-dark);}

  .player-header{background:var(--pink);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;}
  .exit-link{color:#fff;font-weight:700;font-size:13px;letter-spacing:.03em;text-decoration:none;cursor:pointer;}
  .progress-dots{display:flex;gap:6px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
  .progress-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block;}
  .progress-dots span.done{background:#fff;}
  .header-right{text-align:right;font-size:13px;}
  .header-right .lesson-of{font-size:11px;color:rgba(255,255,255,.8);}

  .player-body{padding:40px 60px 110px;min-height:420px;position:relative;}
  .support-tab{position:absolute;left:0;top:120px;background:var(--pink);color:#fff;padding:10px 6px;font-size:10px;letter-spacing:.08em;font-weight:700;writing-mode:vertical-rl;border-radius:0 4px 4px 0;cursor:pointer;z-index:5;}
  .nav-back{position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;transition:.15s;}
  .nav-back:hover{border-color:var(--pink);color:var(--pink);}
  .support-overlay{position:fixed;inset:0;background:rgba(20,20,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .support-card{background:#fff;border-radius:10px;width:380px;max-width:90%;padding:26px 28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;}
  .support-card .sc-close{position:absolute;right:14px;top:14px;cursor:pointer;color:#999;font-size:16px;line-height:1;}
  .support-card h3{margin:0 0 12px;color:var(--pink);font-size:17px;font-weight:800;}
  .support-card p{margin:0;font-size:13.5px;line-height:1.65;color:#3d3d46;}
  .support-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--gray);}
  .support-footer a{color:var(--pink);font-weight:600;text-decoration:none;}
  .ai-tutor-btn{position:absolute;left:20px;bottom:20px;background:#fff;border:1px solid var(--pink);color:var(--pink);padding:8px 14px;border-radius:5px;font-size:11px;font-weight:700;display:flex;flex-direction:column;line-height:1.3;cursor:pointer;z-index:5;}
  .ai-tutor-btn small{font-weight:700;letter-spacing:.06em;font-size:9px;color:var(--pink);}

  .tutor-panel{background:#fff;display:flex;flex-direction:column;overflow:hidden;height:100%;}
  .tutor-panel-head{background:var(--tooltip-blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;flex:none;}
  .tutor-panel-head .tp-close{cursor:pointer;font-size:16px;opacity:.85;}
  .tutor-panel-body{padding:16px;overflow-y:auto;flex:1;background:#f7f8fc;}
  .tutor-disclaimer{background:#6b6b74;color:#fff;font-size:10.5px;line-height:1.5;padding:10px 12px;border-radius:6px;margin-bottom:12px;}
  .tutor-msg{border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.6;margin-bottom:10px;max-width:92%;}
  .tutor-msg.ai{background:#fff;border:1px solid var(--line);color:#333;}
  .tutor-msg.user{background:var(--tooltip-blue);color:#fff;margin-left:auto;}
  .tutor-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .tutor-quick button{border:1px solid var(--tooltip-blue);color:var(--tooltip-blue);background:#fff;border-radius:14px;padding:5px 10px;font-size:11px;cursor:pointer;}
  .tutor-quick button:hover{background:#eef2ff;}
  .tutor-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fff;flex:none;}
  .tutor-input-row input{flex:1;border:1px solid var(--line);border-radius:16px;padding:9px 14px;font-size:12.5px;outline:none;}
  .tutor-input-row input:focus{border-color:var(--tooltip-blue);}
  .tutor-input-row button{background:var(--tooltip-blue);color:#fff;border:none;border-radius:16px;padding:9px 18px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .split-wrap{display:flex;width:100%;min-height:100%;align-items:stretch;}
  .split-lesson{flex:1 1 50%;min-width:0;position:relative;border-right:1px solid var(--line);}
  .split-chat{flex:1 1 46%;min-width:280px;max-width:480px;display:flex;flex-direction:column;}

  .lesson-title{color:var(--pink);font-size:20px;font-weight:800;text-align:center;margin:0 0 6px;}
  .lesson-sub{text-align:center;color:var(--gray);font-size:11px;letter-spacing:.08em;font-weight:700;margin-bottom:26px;}
  .obj-list{max-width:480px;margin:0 auto;}
  .obj-list li{margin-bottom:12px;font-size:14px;line-height:1.4;color:#3d3d46;list-style:none;position:relative;padding-left:26px;}
  .obj-list li:before{content:"✓";position:absolute;left:0;top:0;color:var(--pink);border:1px solid var(--pink);border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;}
  .center-btn-wrap{text-align:center;margin-top:34px;}

  .content-title{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 14px;text-align:center;}
  .content-body{max-width:560px;margin:0 auto;font-size:14px;line-height:1.65;color:#333;}
  .content-body ul{padding-left:20px;}
  .content-body li{margin-bottom:10px;}
  .content-body .ex{color:#555;font-style:italic;}
  .content-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;}
  .content-body th,.content-body td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
  .content-body th{background:#faf4f6;color:var(--pink-dark);font-weight:700;}
  .content-body .callout{border-left:3px solid var(--green);background:#f4fbf6;padding:10px 14px;margin:12px 0;border-radius:0 4px 4px 0;}

  .select-all-label{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--gray);font-weight:700;margin-bottom:14px;}
  .qtext{max-width:600px;margin:0 auto 24px;font-size:14px;line-height:1.65;color:#333;}
  .answer-list{max-width:540px;margin:0 auto;}
  .answer-item{border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-bottom:8px;font-size:13.5px;cursor:pointer;transition:.15s;position:relative;}
  .answer-item:hover{border-color:var(--blue-select);}
  .answer-item.selected{background:var(--blue-select);color:#fff;border-color:var(--blue-select);}
  .answer-item .chk{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;border:1px solid #ccc;border-radius:2px;background:#fff;}
  .answer-item.selected .chk{background:#fff;border-color:#fff;}

  .blank-tag{display:inline;border:1px solid var(--pink);border-radius:3px;background:#fbdfe6;color:transparent;padding:0 6px;}
  .blank-tag.filled{color:#1b7a44;font-weight:700;background:transparent;border-color:transparent;padding:0 3px;}

  .option-list{max-width:540px;margin:22px auto 0;}
  .option-item{border:1px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:10px;font-size:13.5px;cursor:pointer;transition:.15s;}
  .option-item:hover{border-color:var(--blue-select);}
  .option-item.picked-correct{background:var(--teal-correct);color:var(--green-correct-text);border-color:var(--teal-correct);font-weight:700;}
  .option-item.picked-wrong{background:#7a2230;color:#ffb3bd;border-color:#7a2230;font-weight:700;}
  .option-item.dim{color:#bbb;}

  .quiz-progress{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--gray);font-weight:700;margin-bottom:10px;}
  .quiz-q{max-width:560px;margin:0 auto 18px;font-size:15px;font-weight:700;line-height:1.5;color:var(--ink);text-align:center;}
  .quiz-explain{max-width:540px;margin:14px auto 0;font-size:13px;line-height:1.55;padding:12px 16px;border-radius:6px;}
  .quiz-explain.ok{background:#f0fbf4;color:#1b7a44;border-left:3px solid var(--green);}
  .quiz-explain.bad{background:#fdf2f4;color:#a3253f;border-left:3px solid var(--pink);}
  .quiz-results{max-width:560px;margin:0 auto;text-align:center;}
  .qr-score{font-size:34px;font-weight:800;color:var(--ink);}
  .qr-score.pass{color:var(--green-dark);}
  .qr-score.fail{color:var(--pink-dark);}
  .qr-pct{font-size:12.5px;color:#777;margin-top:2px;margin-bottom:6px;}
  .qr-verdict{font-size:15px;font-weight:700;margin:4px 0 20px;color:#333;}
  .qr-detail{text-align:left;margin-bottom:22px;}
  .qr-row{border-radius:6px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;line-height:1.5;}
  .qr-row.ok{background:#f0fbf4;border-left:3px solid var(--green);}
  .qr-row.bad{background:#fdf2f4;border-left:3px solid var(--pink);}
  .qr-q{font-weight:700;color:var(--ink);margin-bottom:3px;}
  .qr-a{color:#444;}
  .qr-explain{color:#666;margin-top:4px;font-style:italic;}
  .lesson-pane-full{width:100%;}
  .quickcheck-badge{display:inline-block;background:#fff3d6;color:#8a5a00;font-size:10px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:12px;margin:0 auto 4px;text-align:center;}
  .carousel-progress{text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--gray);font-weight:700;margin:14px 0 10px;}
  .carousel-row{display:flex;align-items:center;justify-content:center;gap:16px;max-width:560px;margin:0 auto;}
  .carousel-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:18px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
  .carousel-nav:disabled{opacity:.3;cursor:default;}
  .carousel-nav:hover:not(:disabled){border-color:var(--pink);color:var(--pink);}
  .carousel-card{background:#f2ede3;color:#333;border-radius:6px;padding:22px 26px;min-width:340px;max-width:400px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.5;box-shadow:0 3px 0 rgba(0,0,0,.06);}
  .carousel-btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:20px auto 0;}
  .carousel-choice-btn{border:1px solid var(--line);background:#fff;color:#333;padding:11px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .carousel-choice-btn:hover{border-color:var(--pink);}
  .carousel-choice-btn.picked-correct{background:var(--teal-correct);color:var(--green-correct-text);border-color:var(--teal-correct);font-weight:700;}
  .carousel-choice-btn.dim{color:#bbb;cursor:default;}
  .carousel-next-hint{font-size:11px;opacity:.85;margin-top:8px;}

  .mp-badge{background:#d7f3ee;color:#0f6b5c;}
  .match-cols{display:flex;gap:24px;max-width:640px;margin:20px auto 0;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .match-cell{border:1px solid var(--line);border-radius:6px;padding:11px 14px;font-size:12.5px;color:#333;cursor:pointer;background:#fff;text-align:center;transition:.15s;}
  .match-cell:hover:not(.matched){border-color:#2FBFA0;}
  .match-cell.selected{background:#2FBFA0;color:#fff;border-color:#2FBFA0;font-weight:700;}
  .match-cell.matched{background:#d7f3ee;color:#0f6b5c;border-color:#a9e3d6;cursor:default;font-weight:600;}
  .match-tip{max-width:400px;margin:16px auto 0;background:#fdecc8;color:#7a5a00;border-radius:6px;padding:10px 14px;font-size:12px;line-height:1.5;text-align:center;}

  .lc-wrap{padding:50px 20px;display:flex;justify-content:center;}
  .lc-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 40px;max-width:420px;width:100%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .lc-icon{font-size:36px;margin-bottom:8px;}
  .lc-title{color:var(--pink);font-weight:800;font-size:16px;letter-spacing:.02em;margin-bottom:14px;}
  .lc-label{font-size:10px;letter-spacing:.1em;color:var(--gray);font-weight:700;}
  .lc-divider{width:36px;height:1px;background:var(--line);margin:8px auto 14px;}
  .lc-terms{color:var(--pink);font-size:12.5px;line-height:1.9;margin-bottom:20px;}
  .lc-feedback-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:11.5px;color:var(--gray);margin-bottom:6px;}
  .lc-thumb{cursor:pointer;font-size:15px;opacity:.55;transition:.15s;}
  .lc-thumb:hover, .lc-thumb.active{opacity:1;transform:scale(1.15);}
  .lc-tags{margin:12px 0 18px;}
  .lc-tags-label{font-size:11px;color:var(--gray);display:block;margin-bottom:8px;}
  .lc-tag-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .lc-tag{border:1px solid var(--pink);color:var(--pink);background:#fff;border-radius:14px;padding:5px 12px;font-size:11px;cursor:pointer;}
  .lc-tag.active{background:var(--pink);color:#fff;}
  .lc-next-btn{width:100%;margin-top:16px;padding:12px 16px;line-height:1.4;}
  .lc-next-btn small{font-size:9px;letter-spacing:.08em;opacity:.85;}

  .cert-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:#fff;}
  .cert-toolbar-title{font-weight:800;color:var(--pink);font-size:14px;}
  .cert-controls{max-width:520px;margin:22px auto 0;text-align:center;padding:0 20px;}
  .cert-name-label{display:block;font-size:11.5px;color:var(--gray);font-weight:600;margin-bottom:6px;}
  .cert-controls input{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14px;text-align:center;margin-bottom:12px;}
  .cert-controls input:focus{border-color:var(--pink);outline:none;}
  .cert-download-btn{padding:12px 28px;font-size:13px;}
  .cert-hint{font-size:11px;color:var(--gray);margin-top:10px;line-height:1.5;}
  .cert-page{display:flex;justify-content:center;padding:40px 20px 60px;}
  .cert-border{position:relative;width:100%;max-width:760px;aspect-ratio:1.414/1;background:#fffdf7;border:3px solid var(--pink);outline:1px solid var(--pink);outline-offset:-10px;padding:50px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12);font-family:Georgia,'Times New Roman',serif;}
  .cert-ribbon{font-size:38px;margin-bottom:6px;}
  .cert-kicker{font-size:13px;letter-spacing:.25em;color:var(--pink-dark);font-weight:700;margin-bottom:18px;}
  .cert-presented{font-size:13px;color:#555;font-style:italic;margin:6px 0;}
  .cert-name{font-size:32px;color:var(--ink);font-weight:700;margin:8px 0 10px;border-bottom:1.5px solid var(--pink);padding-bottom:10px;display:inline-block;min-width:60%;}
  .cert-course-title{font-size:19px;color:var(--pink);font-weight:800;margin:10px 0 8px;}
  .cert-meta{font-size:12px;color:#777;letter-spacing:.03em;margin-bottom:24px;}
  .cert-footer{display:flex;justify-content:space-between;width:100%;max-width:480px;margin-top:20px;}
  .cert-sig-block, .cert-date-block{text-align:center;}
  .cert-sig-line{font-size:14px;font-weight:700;color:var(--ink);border-top:1px solid #999;padding-top:6px;min-width:150px;}
  .cert-sig-label{font-size:10px;color:var(--gray);letter-spacing:.05em;margin-top:2px;}

  @media print{
    html, body{ background:#fff !important; margin:0; padding:0; }
    body *{ visibility:hidden; }
    .cert-page, .cert-page *{ visibility:visible; }
    .cert-page{ position:absolute; top:0; left:0; width:100%; padding:24px; margin:0; display:flex; justify-content:center; background:#fff; }
    .cert-border{ box-shadow:none; max-width:100%; }
    .no-print{ display:none !important; }
  }
  .mastery-banner{max-width:600px;margin:0 auto 20px;background:#fdf3d9;border:1px solid #f0d896;color:#7a5a00;font-size:12px;font-weight:700;text-align:center;padding:10px 14px;border-radius:6px;}
  .cert-banner{background:linear-gradient(90deg,#fdf3d9,#fdeef2);border-bottom:1px solid var(--line);padding:12px 28px;text-align:center;font-size:13px;font-weight:700;color:#7a5a00;}
  .cert-banner-btn{margin-left:10px;background:var(--pink);color:#fff;border:none;border-radius:14px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;}

  .pron-entry-row{text-align:center;margin-top:22px;}
  .pron-entry-btn{background:#fff;border:1px solid var(--tooltip-blue);color:var(--tooltip-blue);font-weight:700;font-size:12.5px;padding:10px 20px;border-radius:20px;cursor:pointer;}
  .pron-entry-btn:hover{background:#eef2ff;}
  .pronun-card{background:#fff;border-radius:10px;width:420px;max-width:92%;padding:26px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;text-align:center;max-height:88vh;overflow-y:auto;}
  .pronun-card .sc-close{position:absolute;right:14px;top:14px;cursor:pointer;color:#999;font-size:16px;}
  .pronun-icon{font-size:30px;margin-bottom:4px;}
  .pronun-card h3{margin:0 0 4px;color:var(--tooltip-blue);font-size:17px;font-weight:800;}
  .pronun-progress{font-size:10.5px;letter-spacing:.06em;color:var(--gray);font-weight:700;text-transform:uppercase;margin-bottom:12px;}
  .pronun-phrase-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}
  .pronun-nav{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#999;font-size:16px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
  .pronun-nav:disabled{opacity:.3;cursor:default;}
  .pronun-phrase{font-size:14.5px;font-weight:700;color:#222;line-height:1.4;}
  .voice-listen-btn{border:1px solid var(--tooltip-blue);color:var(--tooltip-blue);background:#fff;border-radius:16px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;}
  .voice-divider{border-top:1px solid var(--line);margin:16px 0;}
  .voice-record-btn{background:var(--tooltip-blue);color:#fff;border:none;border-radius:20px;padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;}
  .voice-record-btn.recording{background:#d63b3b;}
  .voice-transcript{margin-top:12px;font-size:13px;color:#333;font-style:italic;min-height:20px;}
  .voice-fallback-note{font-size:11.5px;color:var(--gray);margin:12px 0 8px;}
  .voice-error{background:#fdf2f4;color:#a3253f;border-left:3px solid var(--pink);border-radius:0 4px 4px 0;padding:10px 12px;font-size:12px;line-height:1.55;text-align:left;margin:12px 0;}
  .voice-error code{background:#fff;border:1px solid #f0c3cd;border-radius:3px;padding:1px 5px;font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#7a1030;}
  .mic-cmd{display:block;margin:6px 0;padding:8px 10px !important;}
  #pronunTranscriptInput{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px;}
  .pronun-result{margin-top:16px;padding:14px 16px;border-radius:8px;font-size:12.5px;line-height:1.5;text-align:left;}
  .pronun-result.good{background:#f0fbf4;color:#1b7a44;}
  .pronun-result.ok{background:#fdf6e3;color:#8a6300;}
  .pronun-result.low{background:#fdf2f4;color:#a3253f;}
  .pronun-score{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px;}
  .pronun-words{margin:10px 0;text-align:center;line-height:2;}
  .pw{display:inline-block;padding:3px 8px;border-radius:5px;font-size:12.5px;font-weight:700;margin:2px;}
  .pw.good{background:#d5f3e0;color:#1b7a44;}
  .pw.close{background:#fdecc8;color:#8a6300;}
  .pw.miss{background:#fbdde3;color:#a3253f;text-decoration:line-through;}
  .pronun-tip{margin-top:8px;color:#555;font-style:italic;text-align:center;}
  .raw-badge{display:inline-block;background:#eef2ff;color:var(--tooltip-blue);font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:12px;margin-bottom:12px;}
  .raw-btn-row{display:flex;gap:8px;justify-content:center;}
  .raw-details{margin-top:12px;text-align:left;font-size:11px;color:var(--gray);}
  .raw-details summary{cursor:pointer;font-weight:600;}
  .raw-details-body{margin-top:8px;line-height:1.5;}
  .raw-details-body code{background:#f4f4f6;border-radius:3px;padding:1px 5px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;}
  .speak-badge{display:block;text-align:center;background:#eef2ff;color:var(--tooltip-blue);font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:12px;margin:0 auto;width:fit-content;}
  .speak-panel{max-width:520px;margin:22px auto 0;text-align:center;}
  .speak-panel input{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px;margin-top:10px;}
  .speak-toggle{margin-top:14px;font-size:11.5px;color:var(--gray);text-decoration:underline;cursor:pointer;}
  .pw.keyword{border:2px solid currentColor;font-weight:800;}

  .tutor-callout{position:absolute;right:16px;bottom:24px;width:250px;color:#fff;border-radius:8px;padding:16px 18px 14px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.15);}
  .tutor-callout.blue{background:var(--tooltip-blue);}
  .tutor-callout.green{background:var(--green-correct-text);color:#0d3d20;}
  .tutor-callout.amber{background:#ffd166;color:#5a3d00;}
  .tutor-callout .tc-close{position:absolute;right:10px;top:8px;color:rgba(255,255,255,.8);cursor:pointer;font-size:12px;}
  .tutor-callout .btn-green{margin-top:12px;width:100%;}
  .fc-hint{position:absolute;left:150px;bottom:70px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:200px;box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:11.5px;}
  .fc-hint .fc-title{font-weight:800;font-size:12px;margin-bottom:3px;}

  .continue-row{max-width:600px;margin:34px auto 0;text-align:right;}
  .continue-row .btn-green{padding:11px 26px;}

  .done-wrap{text-align:center;padding-top:70px;}
  .done-wrap h2{color:var(--pink);}

  /* ============ MOBILE-FIRST RESPONSIVE ============ */
  @media (max-width: 720px){
    body{padding:0;background:#fff;}
    .app-nav{padding:12px 14px;flex-wrap:wrap;gap:8px;}
    .app-nav .links{gap:12px;font-size:11.5px;order:3;width:100%;overflow-x:auto;padding-top:6px;border-top:1px solid var(--line);}
    .stats-bar{padding:8px 14px;gap:8px;}
    .stat-chip{font-size:11px;padding:4px 9px;}
    .xp-bar-wrap{display:none;}
    .course-wrap{flex-direction:column;padding:16px;gap:0;}
    .course-title{font-size:19px;}
    .course-desc{max-width:100%;font-size:13.5px;}
    .side-card{width:100%;}
    .start-row{flex-direction:column;align-items:flex-start;gap:10px;}
    .lesson-row{flex-direction:column;align-items:stretch;}
    .lesson-status-col{flex-direction:row;justify-content:space-between;margin-top:10px;}
    .lesson-row .btn-start{width:100%;}
    .milestone-card{flex-direction:column;align-items:flex-start;}
    .milestone-card .btn-start{width:100%;}
    .player-body{padding:28px 20px 100px;}
    .support-tab{top:auto;bottom:110px;}
    .nav-back{left:10px;top:10px;}
    .ai-tutor-btn{left:10px;bottom:10px;font-size:10px;padding:7px 10px;}
    .split-wrap{flex-direction:column;}
    .split-lesson{border-right:none;border-bottom:1px solid var(--line);}
    .split-chat{max-width:100%;min-width:0;min-height:360px;}
    .continue-row{text-align:center;}
    .continue-row .btn-green{width:100%;}
    .option-list{max-width:100%;}
    .qtext, .quiz-q, .content-body{max-width:100%;}
    .support-card, .toast-card, .summaries-card, .pronun-card{width:92%;}
    .content-body table{font-size:11px;}
    .content-body th, .content-body td{padding:4px 5px;}
  }
</style>

    {type:"content", title:"Sentence Patterns", body:`
      <p>Every English sentence you build falls into one of four patterns:</p>
      <ul>
        <li><b>Statements</b></li>
        <li><b>Questions</b></li>
        <li><b>Negatives</b></li>

    {type:"content", title:"Auxiliary: To Be", body:`
      <p><b>to be</b> (am, is, are — was, were — being — been) has three key uses:</p>
      <ul>
        <li>Completing a sentence when there's no other verb available. <span class="ex">I am hungry. I am an employee of Bank Indonesia.</span></li>
        <li>Forming <b>Continuous Tenses</b>: Subject + to be + (Verb+ing). <span class="ex">We are discussing the English language.</span></li>
        <li>Forming <b>Passive Voice</b>: Subject + to be + Past Participle (V3). <span class="ex">The report is prepared by the staff.</span></li>
      </ul>`},
    {type:"content", title:"Auxiliary: To Do", body:`
      <p>As a common verb, <b>to do</b> means "to act." As an auxiliary, it has four uses:</p>
      <ul>
        <li>Building <b>negative</b> sentences: Subject + do/does + not + V1. <span class="ex">I do not (don't) have a job. She does not (doesn't) have a job.</span></li>
        <li>Building <b>question</b> sentences: Do/Does + subject + V1. <span class="ex">Do you have a job? Does she have a job?</span> — the auxiliary always comes before the subject.</li>
        <li><b>Emphasizing</b> the verb: Subject + do + V1. <span class="ex">I do like my job.</span></li>
        <li><b>Substituting</b> the verb. <span class="ex">Do you like your job? Yes, I do.</span></li>
      </ul>`},
    {type:"content", title:"Auxiliary: To Have, and Modals", body:`
      <p><b>to have</b> as an auxiliary builds <b>Perfect Tenses</b>: Subject + have/has/had + Past Participle (V3). <span class="ex">She has worked for Bank Indonesia for fifteen years.</span></p>
      <p><b>Modals</b> modify the meaning of the verb and are always followed by the base verb (V1):</p>
      <ul>
        <li><b>can</b> — ability, permission</li>
        <li><b>may</b> — big possibility, permission, polite questions</li>
        <li><b>must</b> — obligation, necessity, logical conclusion</li>
        <li><b>might</b> — slight possibility</li>
        <li><b>could</b> — possibility, past ability, polite questions</li>
        <li><b>will</b> — future intention</li>
        <li><b>would</b> — past future intention, polite questions</li>
        <li><b>should / ought to / had better</b> — advice</li>
        <li><b>have to / have got to</b> — necessity</li>
      </ul>`},
    {type:"selectAll", prompt:"English has four main auxiliaries. <b>Click on each one</b> to review what it's used for.",

/* ============ PERSISTENCE ============ */
const STORAGE_KEY = 'ecgm_progress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      done: Array.from(state.done),
      masteryPassed: state.masteryPassed,
      milestonesPassed: state.milestonesPassed,
      xp: state.xp,
      bookmarked: state.bookmarked,
      streak: state.streak,
      lastVisit: state.lastVisit,
      firstVisit: state.firstVisit,
      soundOn: state.soundOn,
      certificateName: state.certificateName,
      exerciseScore: state.exerciseScore
    }));
  }catch(e){ /* storage unavailable, fail silently */ }
}
function initProgressAndStreak(){
  const saved = loadProgress();
  const todayStr = new Date().toDateString();
  if(saved){
    state.done = new Set(saved.done || []);
    state.masteryPassed = saved.masteryPassed || {};
    state.milestonesPassed = saved.milestonesPassed || {};
    state.xp = saved.xp || 0;
    state.bookmarked = !!saved.bookmarked;
    state.streak = saved.streak || 0;
    state.lastVisit = saved.lastVisit || null;
    state.firstVisit = saved.firstVisit || todayStr;
    state.soundOn = saved.soundOn !== undefined ? saved.soundOn : true;
    state.certificateName = saved.certificateName || '';
    state.exerciseScore = saved.exerciseScore || {};
    if(state.lastVisit !== todayStr){
      const y = new Date(); y.setDate(y.getDate()-1);
      state.streak = (state.lastVisit === y.toDateString()) ? state.streak + 1 : 1;
      state.lastVisit = todayStr;
    }
  } else {
    state.streak = 1;
    state.lastVisit = todayStr;
    state.firstVisit = todayStr;
    state.soundOn = true;
    state.certificateName = '';
  }
  saveProgress();
}
function addXp(amount){
  state.xp += amount;
  saveProgress();
}
function levelForXp(xp){
  if(xp >= 900) return {name:'Platinum', icon:'💎', next:null};
  if(xp >= 500) return {name:'Gold', icon:'🥇', next:900};
  if(xp >= 220) return {name:'Silver', icon:'🥈', next:500};
  return {name:'Bronze', icon:'🥉', next:220};
}

/* ============ CLICK SOUND ============ */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}
function playClickSound(){
  if(!state.soundOn) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  try{
    const duration = 0.03;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      const decay = Math.pow(1 - i/bufferSize, 4);
      data[i] = (Math.random()*2-1) * decay;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 1200;
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 5000;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    noise.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }catch(e){ /* audio unavailable, fail silently */ }
}

function aiIntroForCurrentScreen(){

  }

  if(!screen){
    return `Hi! This is your mastery check for <b>${l.title}</b>. Take your time on each question — ask me "why" about any topic if you want a refresher before answering.`;
  }

  }
  if(screen.type === "selectAll"){
    return `Hi! Click each item above to reveal a tip about it. If you want, ask me to explain any one of them in more detail.`;
  }
  if(screen.type === "fillBlank"){

  }
  if(screen.type === "quickCheck"){

function deepWhyExplanation(screen, lessonTitle){
  const answer = screen.options[screen.correctIndex];
  const reasoning = screen.feedback || screen.explain || screen.hint || '';
  return `Because of the rule from <b>${lessonTitle}</b>:<br><br>• The correct choice is <b>"${answer}"</b>.<br>• ${reasoning}<br><br><b>Question:</b> can you think of your own sentence where this same rule would apply? Try saying it out loud — building your own example is the real test of whether you've got it, not just recognizing this one.`;
}

function aiReplyTo(userText){
  const lower = userText.toLowerCase();

  if(state.view === 'milestone' && state.quiz){
    const m = MILESTONES.find(x=>x.id===state.activeMilestone);
    const q = state.quiz.questions[state.quiz.qIdx];
    if(lower.includes('why is that') || lower.includes('why the answer') || lower.includes('why is the answer')){
      return deepWhyExplanation(q, m.title);
    }
    if(lower.includes('why') || lower.includes('explain') || lower.includes('how do i answer') || lower.includes('how to answer')){
      return getSlideExplanation();
    }
    if(/\b(hi|hello|hey)\b/.test(lower) && userText.trim().length < 20){
      return `Hello! What part of <b>${m.title}</b> can I help clarify?`;
    }
    if(/\bthanks?\b|\bthank you\b/.test(lower) && userText.trim().length < 30){
      return `You're welcome! Good luck with the rest of the exam.`;
    }
    if(userText.trim().length >= 12){
      const evaluated = evaluateUserAttempt(q, userText);
      if(evaluated) return evaluated;
    }
    return `Good question about this question in <b>${m.title}</b>. ${getSlideExplanation()}`;
  }

  const l = LESSONS[state.lessonIdx];
  const screen = state.screenIdx === -1 ? null : l.screens[state.screenIdx];

  if((lower.includes('why is that') || lower.includes('why the answer') || lower.includes('why is the answer')) && screen && screen.options){
    return deepWhyExplanation(screen, l.title);
  }
  if(lower.includes('why') || lower.includes('explain') || lower.includes('how do i answer') || lower.includes('how to answer')){
    return getSlideExplanation();
  }
  if(screen && screen.type === "fillBlank" && (lower.includes('hint') || (lower.includes('answer') && userText.trim().length < 40))){
    return `💡 ${screen.hint}<br><br>Ask me "why" once you've chosen if you want the full reasoning.`;
  }
  if(lower.includes('example') || lower.includes('another')){
    if(screen && screen.type === "content"){
      return `Sure! Try building your own sentence about something from your own day using the same pattern shown above — swapping in "I," "she," or "they" is a great way to check you've got the formula right.`;
    }
    return `Sure — try applying the pattern from this lesson to a sentence about your own day. That's usually the fastest way to make it stick.`;
  }
  if(/\b(hi|hello|hey)\b/.test(lower) && userText.trim().length < 20){
    return `Hello! What part of <b>${l.title}</b> can I help clarify?`;
  }
  if(/\bthanks?\b|\bthank you\b/.test(lower) && userText.trim().length < 30){
    return `You're welcome! Good luck with the rest of the lesson.`;
  }
  // Longer pasted/typed text (e.g. the student's attempted sentence or answer)
  // gets checked against the known correct/incorrect options for a tailored verdict.
  if(userText.trim().length >= 12){
    const evaluated = evaluateUserAttempt(screen, userText);
    if(evaluated) return evaluated;
  }
  return `Good question about <b>${l.title}</b>. ${getSlideExplanation()}`;
}

/* ============ GENERIC QUIZ ENGINE (mastery checks + milestone exams) ============ */
function quizOptionLabel(i){ return String.fromCharCode(65+i); }

function quizBodyHtml(quiz, onPassCb, onRetryCb, exitLabel){
  const qIdx = quiz.qIdx;
  const total = quiz.questions.length;
  if(qIdx >= total){
    const correctCount = quiz.picks.filter((p,i)=>p===quiz.questions[i].correctIndex).length;
    let passed, scoreLabel, exStats = null, beyondQuizRecovery = false;
    if(quiz.kind === 'mastery' || quiz.kind === 'mastery-remedial'){
      exStats = computeLessonExerciseScore(state.lessonIdx);
      const combinedCorrect = exStats.correct + correctCount;
      const combinedTotal = exStats.total + total;
      const pct = combinedTotal>0 ? Math.round((combinedCorrect/combinedTotal)*100) : 100;
      const maxPossiblePct = combinedTotal>0 ? Math.round(((exStats.correct+total)/combinedTotal)*100) : 100;
      passed = pct >= 80;
      beyondQuizRecovery = !passed && maxPossiblePct < 80;
      scoreLabel = `${pct}%`;
      // For remedial, show explicit message about stricter requirement
      const remedialNote = quiz.kind === 'mastery-remedial' ? ' (Remedial: focused on skills you missed)' : '';
    } else {
      passed = correctCount >= quiz.passScore;
      scoreLabel = `${correctCount} / ${total}`;
    }
    return `
      <div class="quiz-results">
        <div class="qr-score ${passed?'pass':'fail'}">${scoreLabel}</div>
        ${quiz.kind === 'mastery' ? `<div class="qr-pct">Exercises: ${exStats.correct}/${exStats.total} · Mastery Check: ${correctCount}/${total} · 80% overall needed to pass</div>` : ''}
        <div class="qr-verdict">${passed ? '✅ Mastery Achieved!' : '❌ Not Quite Yet'}</div>
        <div class="qr-detail">
          ${beyondQuizRecovery ? `<div class="qr-row bad"><div class="qr-a">Too many earlier exercises in this lesson were missed for a quiz retake alone to reach 80%. Use "Redo Entire Lesson" below to try again from the start.</div></div>` : ''}
          ${quiz.questions.map((q,i)=>`
            <div class="qr-row ${quiz.picks[i]===q.correctIndex?'ok':'bad'}">
              <div class="qr-q">${i+1}. ${q.q}</div>
              <div class="qr-a">Your answer: <b>${q.options[quiz.picks[i]]}</b>${quiz.picks[i]!==q.correctIndex?` — Correct: <b>${q.options[q.correctIndex]}</b>`:''}</div>
              ${q.explain ? `<div class="qr-explain">${q.explain}</div>` : ''}
            </div>`).join('')}
        </div>
        ${passed
          ? `<button class="btn-green" style="padding:12px 30px;" onclick="${onPassCb}">CONTINUE</button>`
          : beyondQuizRecovery
            ? `<button class="btn-green" style="padding:12px 30px;background:var(--pink);" onclick="resetLessonProgress(${state.lessonIdx})">REDO ENTIRE LESSON</button>`
            : `<button class="btn-green" style="padding:12px 30px;background:var(--pink);" onclick="${onRetryCb}">TRY AGAIN</button>`}
      </div>`;
  }
  const q = quiz.questions[qIdx];
  const picked = quiz.picks[qIdx];
  return `
    <div class="quiz-progress">Question ${qIdx+1} of ${total}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="option-list">
      ${q.options.map((opt,i)=>{
        let cls = '';
        if(picked !== null){
          if(i === q.correctIndex) cls = 'picked-correct';
          else if(i === picked) cls = 'picked-wrong';
          else cls = 'dim';
        }
        return `<div class="option-item ${cls}" onclick="pickQuizAnswer(${i})"><b>${quizOptionLabel(i)}.</b> ${opt}</div>`;
      }).join('')}
    </div>
    ${picked !== null ? `
      <div class="quiz-explain ${picked===q.correctIndex?'ok':'bad'}">
        ${picked===q.correctIndex ? '✓ Correct! ' : '✗ Not quite. '} ${q.explain || ''}
      </div>
      <div class="continue-row"><button class="btn-green" onclick="quizNext()">${qIdx+1<total?'NEXT QUESTION':'SEE RESULTS'}</button></div>
    ` : ''}
  `;
}
function pickQuizAnswer(i){
  const quiz = state.quiz;
  if(!quiz || quiz.picks[quiz.qIdx] !== null) return;
  quiz.picks[quiz.qIdx] = i;
  if(quiz.kind === 'mastery') renderLessonScreen(); else renderMilestoneScreen();
}
function quizNext(){
  state.quiz.qIdx++;
  if(state.quiz.kind === 'mastery') renderLessonScreen(); else renderMilestoneScreen();
}
function quizRetryMastery(){
  const quiz = state.quiz;
  
  // Detect which skills were missed (if questions have skill tags)
  const missed = [];
  quiz.questions.forEach((q, i) => {
    if(quiz.picks[i] !== q.correctIndex && q.skill) {
      if(!missed.includes(q.skill)) missed.push(q.skill);
    }
  });
  
  // If questions have skill tags, build a targeted remedial quiz
  if(missed.length > 0 && REMEDIAL_ITEMS.length > 0) {
    const remedialQuestions = REMEDIAL_ITEMS.filter(r => missed.includes(r.skill));
    const originalQs = quiz.questions.filter(q => !q.skill || !missed.includes(q.skill));
    
    // Mix 2-3 remedial + 2-3 original = 4-6 total, pass 80%+
    const mixed = [
      ...remedialQuestions.slice(0, 3),
      ...originalQs.slice(0, 3)
    ].slice(0, 6);
    
    state.quiz = {
      kind: 'mastery-remedial',
      questions: mixed,
      passScore: 5,  // 5 out of 6 = 83%, stricter than original 2/3
      qIdx: 0,
      picks: new Array(mixed.length).fill(null),
      isRemedial: true
    };
  } else {
    // Fallback: just reset picks and try again
    quiz.qIdx = 0;
    quiz.picks = new Array(quiz.questions.length).fill(null);
  }
  
  renderLessonScreen();
}
function quizRetryMilestone(){
  const quiz = state.quiz;
  quiz.qIdx = 0;
  quiz.picks = new Array(quiz.questions.length).fill(null);
  renderMilestoneScreen();
}

  rawSupported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),

/* Pick the most natural-sounding available voice, rather than letting the
   browser fall back to a default synthetic/robotic engine. Cloud-backed
   voices (Google/Microsoft "Online"/"Natural") sound far more human than
   local system voices like eSpeak, so we prefer those when present. */
let cachedVoice = null;
function pickBestVoice(){
  if(cachedVoice) return cachedVoice;
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;

    "Google US English", "Google UK English Female", "Google UK English Male",
    "Microsoft Aria Online (Natural)", "Microsoft Jenny Online (Natural)",
    "Microsoft Guy Online (Natural)", "Microsoft Sonia Online (Natural)",
    "Samantha", "Alex", "Microsoft Zira Desktop", "Microsoft David Desktop"
  ];
  for(const name of preferredNames){
    const v = voices.find(v => v.name === name);
    if(v){ cachedVoice = v; return v; }
  }
  // Prefer any non-local (cloud) English voice — these are almost always
  // higher quality than the OS's built-in offline synthesizer.
  const cloudVoice = voices.find(v => v.lang && v.lang.startsWith('en') && v.localService === false);
  if(cloudVoice){ cachedVoice = cloudVoice; return cloudVoice; }
  const anyEnglish = voices.find(v => v.lang && v.lang.startsWith('en'));
  if(anyEnglish){ cachedVoice = anyEnglish; return anyEnglish; }
  cachedVoice = voices[0];
  return cachedVoice;

/* Diagnose *why* the mic is likely to fail before we even try — the most
   common real-world cause is that this file was opened directly (file://)
   rather than served over http(s), which Chrome/Edge/Firefox all block
   microphone access on regardless of what permission the user grants. */
function micEnvironmentIssue(){
  if(location.protocol === 'file:'){
    return {
      reason: 'file',
      html: `Your browser is blocking the microphone because this page was opened directly as a local file (<code>file://</code>), not through a web address. Most browsers disable mic access entirely on local files as a security measure — this isn't something a permission popup can fix.<br><br>
      <b>To use the microphone:</b> open a terminal in the folder with this file and run:<br>
      <code class="mic-cmd">python3 -m http.server 8000</code><br>
      then visit <code>http://localhost:8000</code> in your browser instead of double-clicking the file.<br><br>
      Or just type what you said below — the AI review works exactly the same either way.`
    };
  }
  if(window.self !== window.top){
    return {
      reason: 'iframe',
      html: `The microphone may be blocked because this page is embedded inside another page (an iframe) that hasn't granted it microphone permission. Try opening this file in its own browser tab, or type what you said below — the AI review works exactly the same either way.`
    };
  }
  if(window.isSecureContext === false){
    return {
      reason: 'insecure',
      html: `Your browser is blocking the microphone because this page isn't loaded over a secure connection (HTTPS or localhost). Try serving it locally (see tip above) or type what you said below instead.`
    };
  }
  return null;
}

    try{ URL.revokeObjectURL(pronunState.rawUrl); }catch(e){}
    pronunState.rawUrl = null;

  pronunState.rawRecorder = null;
  pronunState.rawChunks = [];

async function startRawRecording(){
  pronunState.rawError = null;
  if(pronunState.rawUrl){ try{ URL.revokeObjectURL(pronunState.rawUrl); }catch(e){} pronunState.rawUrl = null; }
  pronunState.rawRequesting = true;

    rec.ondataavailable = (e) => { if(e.data && e.data.size > 0) pronunState.rawChunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(pronunState.rawChunks, {type: rec.mimeType || 'audio/webm'});
      pronunState.rawUrl = URL.createObjectURL(blob);
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      pronunState.rawStream = null;
      pronunState.rawRecording = false;
      renderLessonScreen();
    };
    rec.start();
    pronunState.rawRecording = true;
    renderLessonScreen();
    setTimeout(()=>{ if(pronunState.rawRecording && pronunState.rawRecorder===rec){ try{ rec.stop(); }catch(e){} } }, 6000);
  }catch(e){
    pronunState.rawRequesting = false;
    pronunState.rawRecording = false;
    if(e.name === 'NotAllowedError'){
      pronunState.rawError = "Microphone access was denied. This is a genuine browser permission block — there's no way around it except allowing access or using the typed option below.";

      pronunState.rawError = "No microphone was found on this device.";
    } else {

    }
    renderLessonScreen();
  }
}

/* --- security: escape user-typed text before inserting into innerHTML, to
   prevent XSS via the Hint Helper chat input or the certificate name field --- */
function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* --- scoring: LCS word alignment between target phrase and what was heard/typed --- */
function normalizeWords(s){
  return s.toLowerCase().replace(/\//g,' ').replace(/[^\w\s']/g,'').split(/\s+/).filter(Boolean);
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},(_,i)=>[i,...new Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function alignWords(targetWords, spokenWords){
  const m=targetWords.length, n=spokenWords.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = targetWords[i-1]===spokenWords[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
    }
  }
  let i=m, j=n;
  const matched = new Array(m).fill(false);
  while(i>0 && j>0){
    if(targetWords[i-1]===spokenWords[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return matched;
}
function checkPronunciation(){
  pronunState.recognizing = false;
  const typed = document.getElementById('pronunTranscriptInput');
  const spokenRaw = (pronunState.transcript || (typed ? typed.value : '')).trim();
  if(!spokenRaw) return;
  pronunState.transcript = spokenRaw;
  const target = currentPhrases()[pronunState.phraseIdx];
  const targetWords = normalizeWords(target);
  const spokenWords = normalizeWords(spokenRaw);
  const matched = alignWords(targetWords, spokenWords);
  const wordResults = targetWords.map((w,idx)=>{
    if(matched[idx]) return {word:w, status:'good'};
    const close = spokenWords.some(sw => levenshtein(w, sw) <= (w.length>5?2:1));
    return {word:w, status: close ? 'close' : 'miss'};
  });
  const goodCount = wordResults.filter(w=>w.status==='good').length;
  const closeCount = wordResults.filter(w=>w.status==='close').length;
  const score = Math.round(((goodCount + closeCount*0.5) / targetWords.length) * 100);
  let verdict, tip;
  if(score >= 85){ verdict = "Excellent pronunciation! 🎉"; tip = "Every word came through clearly. Try the next phrase."; addXp(15); }
  else if(score >= 60){ verdict = "Pretty good."; tip = "Most words were clear. Slow down on the highlighted ones and try again."; addXp(8); }
  else { verdict = "Let's try that again."; tip = "Listen to the model pronunciation again, then repeat it slowly, word by word."; }
  pronunState.result = { verdict, tip, score, wordResults };
  renderLessonScreen();
}

/* Detect a longer pasted/typed message (not a short keyword command) that
   likely contains the student's attempt, and give a tailored verdict by
   checking it against the known correct/incorrect options — the closest
   honest approximation of "review what I pasted" without a live model. */
function evaluateUserAttempt(screen, userText){
  if(!screen || !screen.options || screen.correctIndex===undefined) return null;
  const userWords = normalizeWords(userText);
  const correctWords = normalizeWords(screen.options[screen.correctIndex]);
  const correctPresent = correctWords.length>0 && correctWords.every(w=>userWords.includes(w));
  const wrongOptions = screen.options.filter((_,i)=>i!==screen.correctIndex);
  const wrongHit = wrongOptions.find(opt=>{
    const ws = normalizeWords(opt);
    return ws.length>0 && ws.every(w=>userWords.includes(w));
  });
  if(correctPresent && !wrongHit){
    return `Looking at what you shared — you've used <b>"${screen.options[screen.correctIndex]}"</b>. That matches the rule here. ✅<br><br>${screen.feedback||screen.explain||screen.hint||''}<br><br>Go ahead and lock that in above.`;
  }
  if(wrongHit && !correctPresent){
    return `Looking at what you shared — you've used <b>"${wrongHit}"</b>, but that's the one to avoid here. ❌<br><br>💡 ${screen.hint||screen.explain||''}<br><br>Try swapping in the other option and see if it fits the rule better.`;
  }
  return null;
}

/* --- lesson-wide scoring: every gradable exercise (quickCheck, carouselClassify
   card, matchPairs pair, fillBlank) records whether it was answered correctly
   on the FIRST attempt. A wrong attempt permanently records that exercise as
   incorrect for scoring purposes, even if the student then finds the right
   answer and continues — this is what makes a wrong answer "cost" toward the
   80% passing bar, without blocking the student from moving on. */
function recordExerciseResult(subKey, correctFirstTry){
  if(state.exerciseScore[subKey] !== undefined) return; // only the first attempt counts
  state.exerciseScore[subKey] = correctFirstTry ? 1 : 0;

function computeLessonExerciseScore(lessonIdx){
  const prefix = `L${lessonIdx}S`;
  let correct = 0, total = 0;
  Object.keys(state.exerciseScore).forEach(k=>{
    if(k.startsWith(prefix)){
      total++;
      correct += state.exerciseScore[k];
    }
  });
  return { correct, total };
}
/* Safety valve: if a student has missed so many exercises earlier in the lesson
   that even a perfect Mastery Check retake can't reach 80% overall, retaking just
   the quiz can never succeed — so this clears the whole lesson's recorded scores
   and restarts it from screen 1, giving a real path to passing again. */
function resetLessonProgress(lessonIdx){
  const prefix = `L${lessonIdx}S`;
  Object.keys(state.exerciseScore).forEach(k=>{ if(k.startsWith(prefix)) delete state.exerciseScore[k]; });
  Object.keys(state.answers).forEach(k=>{ if(k.startsWith(prefix)) delete state.answers[k]; });
  Object.keys(state.wrongAttempts).forEach(k=>{ if(k.startsWith(prefix)) delete state.wrongAttempts[k]; });
  state.masteryPassed[lessonIdx] = false;
  state.done.delete(lessonIdx);

  state.screenIdx = 0;
