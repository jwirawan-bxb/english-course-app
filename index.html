/* ============ SPEAK-YOUR-ANSWER (fill-in-the-blank via voice) ============ */
/* Reuses the same word-alignment engine as Pronunciation Practice, but
   grades against the FULL correct sentence and specifically flags whether
   the key blank-word(s) came through — merging the grammar check and the
   pronunciation check into a single spoken attempt. */
let speakBlankState = {
  forKey:null, recognizing:false, requesting:false, recognizer:null,
  rawSupported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
  rawStream:null, rawRecorder:null, rawChunks:[], rawUrl:null, rawRecording:false, rawRequesting:false, rawError:null,
  transcript:'', errorMsg:null, showOptions:false, lastResult:null
};
function ensureSpeakBlankState(k){
  if(speakBlankState.forKey !== k){
    if(speakBlankState.recognizer){ try{ speakBlankState.recognizer.stop(); }catch(e){} }
    if(speakBlankState.rawStream){ try{ speakBlankState.rawStream.getTracks().forEach(t=>t.stop()); }catch(e){} }
    if(speakBlankState.rawUrl){ try{ URL.revokeObjectURL(speakBlankState.rawUrl); }catch(e){} }
    speakBlankState = {
      forKey:k, recognizing:false, requesting:false, recognizer:null,
      rawSupported: speakBlankState.rawSupported,
      rawStream:null, rawRecorder:null, rawChunks:[], rawUrl:null, rawRecording:false, rawRequesting:false, rawError:null,
      transcript:'', errorMsg:null, showOptions:false, lastResult:null
    };
  }
}
function fillBlankTargetSentence(screen){
  const answer = screen.options[screen.correctIndex];
  const filled = screen.prompt.replace(/<span class="blank-tag BLANK">&nbsp;<\/span>/, answer);
  return stripTags(filled);
}
function scoreSpokenFillBlank(screen, spokenRaw){
  const target = fillBlankTargetSentence(screen);
  const targetWords = normalizeWords(target);
  const spokenWords = normalizeWords(spokenRaw);
  const matched = alignWords(targetWords, spokenWords);
  const keyWords = normalizeWords(screen.options[screen.correctIndex]);
  let keyStart = -1;
  for(let i=0;i<=targetWords.length-keyWords.length;i++){
    let ok = true;
    for(let j=0;j<keyWords.length;j++){ if(targetWords[i+j]!==keyWords[j]){ ok=false; break; } }
    if(ok){ keyStart=i; break; }
  }
  const wordResults = targetWords.map((w,idx)=>{
    const isKey = keyStart>=0 && idx>=keyStart && idx<keyStart+keyWords.length;
    let status;
    if(matched[idx]) status='good';
    else{
      const close = spokenWords.some(sw=>levenshtein(w,sw) <= (w.length>5?2:1));
      status = close ? 'close' : 'miss';
    }
    return {word:w, status, key:isKey};
  });
  const keyResults = wordResults.filter(w=>w.key);
  const keyGood = keyResults.length>0 && keyResults.every(w=>w.status==='good');
  const keyClose = keyResults.length>0 && !keyGood && keyResults.every(w=>w.status!=='miss');
  const goodCount = wordResults.filter(w=>w.status==='good').length;
  const closeCount = wordResults.filter(w=>w.status==='close').length;
  const overallScore = Math.round(((goodCount+closeCount*0.5)/targetWords.length)*100);
  return { wordResults, keyGood, keyClose, overallScore, target };
}
function speakBlankSupportsRecognition(){ return pronunSupportsRecognition(); }
function startSpeakBlank(){
  const k = key();
  ensureSpeakBlankState(k);
  speakBlankState.errorMsg = null;
  if(!speakBlankSupportsRecognition()){
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    setTimeout(()=>{ const el=document.getElementById('speakBlankInput'); if(el) el.focus(); }, 0);
    return;
  }
  const envIssue = micEnvironmentIssue();
  if(envIssue && speakBlankState.rawSupported){
    startSpeakBlankRaw();
    return;
  }
  if(envIssue){
    speakBlankState.errorMsg = envIssue.html;
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    return;
  }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try{ rec = new Rec(); }catch(e){
    speakBlankState.errorMsg = "Couldn't start speech recognition in this browser. Type what you said below instead.";
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    return;
  }
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  speakBlankState.recognizing = true; speakBlankState.requesting = true; speakBlankState.recognizer = rec;
  renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  const watchdogId = setTimeout(()=>{
    if(speakBlankState.recognizing && speakBlankState.recognizer===rec){
      try{ rec.stop(); }catch(e){}
      speakBlankState.recognizing=false; speakBlankState.requesting=false;
      speakBlankState.errorMsg = "No response from the microphone after 8 seconds. Type what you said below instead.";
      renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    }
  }, 8000);
  rec.onresult = (e)=>{
    clearTimeout(watchdogId);
    speakBlankState.transcript = e.results[0][0].transcript;
    speakBlankState.recognizing=false; speakBlankState.requesting=false;
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  };
  rec.onaudiostart = ()=>{ speakBlankState.requesting=false; renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]); };
  rec.onerror = (e)=>{
    clearTimeout(watchdogId);
    speakBlankState.recognizing=false; speakBlankState.requesting=false;
    const envIssue2 = (e.error==='not-allowed'||e.error==='service-not-allowed') ? micEnvironmentIssue() : null;
    speakBlankState.errorMsg = (envIssue2 && envIssue2.html) || PRONUN_ERROR_MESSAGES[e.error] || `Speech recognition error (${e.error}). Type what you said below instead.`;
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  };
  rec.onend = ()=>{ clearTimeout(watchdogId); speakBlankState.recognizing=false; speakBlankState.requesting=false; };
  try{ rec.start(); }catch(e){
    speakBlankState.recognizing=false; speakBlankState.requesting=false;
    speakBlankState.errorMsg = "Couldn't start the microphone (" + e.message + "). Type what you said below instead.";
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  }
}
function stopSpeakBlank(){
  if(speakBlankState.recognizer){ try{ speakBlankState.recognizer.stop(); }catch(e){} }
  speakBlankState.recognizing=false; speakBlankState.requesting=false;
  renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
}
async function startSpeakBlankRaw(){
  speakBlankState.errorMsg = null;
  if(speakBlankState.rawUrl){ try{ URL.revokeObjectURL(speakBlankState.rawUrl); }catch(e){} speakBlankState.rawUrl=null; }
  speakBlankState.rawRequesting = true;
  renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    speakBlankState.rawStream = stream;
    speakBlankState.rawRequesting = false;
    speakBlankState.rawChunks = [];
    const rec = new MediaRecorder(stream);
    speakBlankState.rawRecorder = rec;
    rec.ondataavailable = (e)=>{ if(e.data && e.data.size>0) speakBlankState.rawChunks.push(e.data); };
    rec.onstop = ()=>{
      const blob = new Blob(speakBlankState.rawChunks, {type: rec.mimeType || 'audio/webm'});
      speakBlankState.rawUrl = URL.createObjectURL(blob);
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      speakBlankState.rawStream = null;
      speakBlankState.rawRecording = false;
      renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    };
    rec.start();
    speakBlankState.rawRecording = true;
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    setTimeout(()=>{ if(speakBlankState.rawRecording && speakBlankState.rawRecorder===rec){ try{ rec.stop(); }catch(e){} } }, 6000);
  }catch(e){
    speakBlankState.rawRequesting=false; speakBlankState.rawRecording=false;
    speakBlankState.errorMsg = e.name==='NotAllowedError'
      ? "Microphone access was denied. Type what you said below instead."
      : "Couldn't access the microphone. Type what you said below instead.";
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
  }
}
function stopSpeakBlankRaw(){
  if(speakBlankState.rawRecorder && speakBlankState.rawRecording){ try{ speakBlankState.rawRecorder.stop(); }catch(e){} }
}
function toggleSpeakBlankOptions(){
  speakBlankState.showOptions = !speakBlankState.showOptions;
  renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
}
function submitSpokenFillBlank(){
  const screen = LESSONS[state.lessonIdx].screens[state.screenIdx];
  const typed = document.getElementById('speakBlankInput');
  const text = ((typed && typed.value) || speakBlankState.transcript || '').trim();
  if(!text) return;
  speakBlankState.transcript = text;
  const result = scoreSpokenFillBlank(screen, text);
  speakBlankState.lastResult = result;
  const k = key();
  if(result.keyGood){
    state.answers[k] = screen.correctIndex;
    recordExerciseResult(k, (state.wrongAttempts[k]||0) === 0);
    addXp(8);
  } else {
    state.wrongAttempts[k] = (state.wrongAttempts[k] || 0) + 1;
    recordExerciseResult(k, false);
  }
  renderFillBlankScreen(screen);
}

function renderFillBlankScreen(screen){
  const k = key();
  ensureSpeakBlankState(k);
  const picked = state.answers[k] !== undefined ? state.answers[k] : null;
  const wrongCount = state.wrongAttempts[k] || 0;
  const showHint = wrongCount >= 1 && picked === null;
  const showNudge = wrongCount >= 2 && picked === null;
  const lastWrong = state.lastWrongPick && state.lastWrongPick.key === k ? state.lastWrongPick.idx : null;
  const filledPrompt = screen.prompt.replace(
    /<span class="blank-tag BLANK">&nbsp;<\/span>/,
    `<span class="blank-tag ${picked!==null?'filled':''}">${picked!==null ? screen.options[picked] : '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0'}</span>`
  );
  const canRecognize = speakBlankSupportsRecognition();
  const envIssue = canRecognize ? micEnvironmentIssue() : null;
  const useRawFallback = envIssue && speakBlankState.rawSupported;
  const r = speakBlankState.lastResult;
  const inner = `
    ${playerHeader()}
    <div class="player-body">
      ${navBackHtml()}
      <div class="support-tab" onclick="toggleSupport()">Support</div>
      <div class="speak-badge">🎤 SAY THE FULL SENTENCE</div>
      <div class="qtext" style="text-align:center;margin-top:10px;">${filledPrompt}</div>

      ${picked===null ? `
        <div class="speak-panel">
          ${useRawFallback ? `
            <div class="raw-badge">🎙️ Mic mode: record &amp; compare (works without a server)</div>
            ${speakBlankState.rawUrl ? `
              <div class="voice-transcript">✓ Recording captured — now type what you said below to get it checked.</div>
              <div class="raw-btn-row">
                <button class="voice-listen-btn" onclick="new Audio(speakBlankState.rawUrl).play().catch(()=>{})">▶ Play mine</button>
                <button class="pron-entry-btn" onclick="startSpeakBlankRaw()">⏺ Re-record</button>
              </div>
            ` : `
              <button class="voice-record-btn ${speakBlankState.rawRecording?'recording':''}" onclick="${speakBlankState.rawRecording?'stopSpeakBlankRaw()':'startSpeakBlankRaw()'}">
                ${speakBlankState.rawRecording ? '⏹ Stop Recording' : (speakBlankState.rawRequesting?'⏳ Requesting mic…':'⏺ Start Recording')}
              </button>
              <div class="voice-transcript">${speakBlankState.rawRecording ? 'Recording… (auto-stops after 6s)' : ''}</div>
            `}
          ` : canRecognize ? `
            <button class="voice-record-btn ${speakBlankState.recognizing?'recording':''}" onclick="${speakBlankState.recognizing?'stopSpeakBlank()':'startSpeakBlank()'}">
              ${speakBlankState.recognizing ? (speakBlankState.requesting?'⏳ Requesting mic…':'⏹ Stop Recording') : '🎤 Speak Your Answer'}
            </button>
            <div class="voice-transcript">${speakBlankState.recognizing ? (speakBlankState.requesting?'Waiting for microphone permission…':'Listening…') : ''}</div>
          ` : ''}
          ${speakBlankState.errorMsg ? `<div class="voice-error">⚠️ ${speakBlankState.errorMsg}</div>` : ''}
          <div class="voice-fallback-note">${canRecognize ? 'You can also type or edit what you said:' : "Your browser doesn't support speech recognition here, so type what you said:"}</div>
          <input id="speakBlankInput" type="text" placeholder="Type the full sentence you said..." value="${speakBlankState.transcript||''}" />
          <button class="btn-green" style="margin-top:12px;width:100%;" onclick="submitSpokenFillBlank()">Check My Answer</button>
          ${r ? `
            <div class="pronun-result ${r.keyGood?'good':(r.keyClose?'ok':'low')}" style="margin-top:14px;">
              <div class="pronun-score">${r.overallScore}%</div>
              <b>${r.keyGood ? '✓ Correct — and clearly said!' : (r.keyClose ? 'Almost — key word was a bit unclear' : '✗ Not quite the right word')}</b>
              <div class="pronun-words">${r.wordResults.map(w=>`<span class="pw ${w.status} ${w.key?'keyword':''}">${w.word}</span>`).join(' ')}</div>
            </div>` : ''}
          <div class="speak-toggle" onclick="toggleSpeakBlankOptions()">${speakBlankState.showOptions ? '▲ Hide answer choices' : '▼ Prefer to choose from options instead?'}</div>
          ${speakBlankState.showOptions ? `
            <div class="option-list">
              ${screen.options.map((t,i)=>`
                <div class="option-item ${lastWrong===i?'picked-wrong':''}" onclick="pickFillBlank(${i}, ${screen.correctIndex})">${t}</div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      ` : ''}

      <div class="ai-tutor-btn" onclick="toggleAiTutor()"><small>💡 HINT</small>Explain This Screen</div>
      ${picked!==null ? `
      <div class="tutor-callout green">
        <span class="tc-close" onclick="this.parentElement.style.display='none'">✕</span>
        ${screen.feedback}
        <button class="btn-green" onclick="nextScreen()">CONTINUE</button>
      </div>` : ''}
      ${showHint ? `
      <div class="tutor-callout amber">
        <span class="tc-close" onclick="this.parentElement.style.display='none'">✕</span>
        💡 <b>Hint:</b> ${screen.hint}
        ${showNudge ? `<button class="btn-green" style="background:#5a3d00;" onclick="nudgeOpenTutor()">Still stuck? Get More Help</button>` : ''}
      </div>` : ''}
    </div>
    ${supportModalHtml()}`;
  finalizeScreenHtml(inner);
}
function pickFillBlank(i, correctIndex){
  const k = key();
  if(i !== correctIndex){
    state.wrongAttempts[k] = (state.wrongAttempts[k] || 0) + 1;
    state.lastWrongPick = {key:k, idx:i};
    recordExerciseResult(k, false);
    renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
    return;
  }
  state.answers[k] = i;
  recordExerciseResult(k, (state.wrongAttempts[k]||0) === 0);
  addXp(5);
  renderFillBlankScreen(LESSONS[state.lessonIdx].screens[state.screenIdx]);
}
function nudgeOpenTutor(){
  state.tutor.open = true;
  const k = tutorKey();
  state.tutor.msgs[k] = [{role:'ai', text: aiIntroForCurrentScreen()}, {role:'user', text:'I need a hint'}, {role:'ai', text: aiReplyTo('give me a hint')}];
  renderLessonScreen();
}

function renderExplainScreen(screen){
  const isLast = state.screenIdx === LESSONS[state.lessonIdx].screens.length-1;
  const inner = `
    ${playerHeader()}
    <div class="player-body">
      ${navBackHtml()}
      <div class="support-tab" onclick="toggleSupport()">Support</div>
      <div class="content-body" style="max-width:560px;">
        ${screen.body.map(p=>`<p>${p}</p>`).join('')}
      </div>
      <div class="ai-tutor-btn" onclick="toggleAiTutor()"><small>💡 HINT</small>Explain This Screen</div>
      <div class="continue-row"><button class="btn-green" onclick="nextScreen()">${isLast ? 'TAKE MASTERY CHECK →' : 'CONTINUE'}</button></div>
    </div>
    ${supportModalHtml()}`;
  finalizeScreenHtml(inner);
}

/* ============ QUICK CHECK (Active Learning Engine) ============ */
function renderQuickCheckScreen(screen){
  const k = key();
  const picked = state.answers[k] !== undefined ? state.answers[k] : null;
  const inner = `
    ${playerHeader()}
    <div class="player-body">
      ${navBackHtml()}
      <div class="support-tab" onclick="toggleSupport()">Support</div>
      <div class="quickcheck-badge">⚡ QUICK CHECK</div>
      <div class="quiz-q" style="margin-top:10px;">${screen.q}</div>
      <div class="option-list">
        ${screen.options.map((opt,i)=>{
          let cls = '';
          if(picked !== null){
            if(i === screen.correctIndex) cls = 'picked-correct';
            else if(i === picked) cls = 'picked-wrong';
            else cls = 'dim';
          }
          return `<div class="option-item ${cls}" onclick="pickQuickCheck(${i}, ${screen.correctIndex})">${opt}</div>`;
        }).join('')}
      </div>
      <div class="ai-tutor-btn" onclick="toggleAiTutor()"><small>💡 HINT</small>Explain This Screen</div>
      ${picked !== null ? `
      <div class="tutor-callout ${picked===screen.correctIndex?'green':'blue'}">
        <span class="tc-close" onclick="this.parentElement.style.display='none'">✕</span>
        ${picked===screen.correctIndex ? '✓ ' : '✗ '}${screen.feedback}
        <button class="btn-green" onclick="nextScreen()">CONTINUE</button>
      </div>` : ''}
    </div>
    ${supportModalHtml()}`;
  finalizeScreenHtml(inner);
}
function pickQuickCheck(i, correctIndex){
  const k = key();
  if(state.answers[k] !== undefined) return;
  state.answers[k] = i;
  recordExerciseResult(k, i === correctIndex);
  if(i === correctIndex) addXp(5);
  renderLessonScreen();
}

/* ============ CAROUSEL CLASSIFY (multi-card classification carousel) ============ */
let carouselState = { forKey:null, idx:0, answers:[] };
function ensureCarouselState(screen, k){
  if(carouselState.forKey !== k){
    carouselState = { forKey:k, idx:0, answers:new Array(screen.cards.length).fill(null) };
  }
}
function carouselNav(dir){
  const screen = LESSONS[state.lessonIdx].screens[state.screenIdx];
  carouselState.idx = Math.max(0, Math.min(screen.cards.length-1, carouselState.idx+dir));
  renderLessonScreen();
}
function pickCarouselAnswer(btnIdx){
  const screen = LESSONS[state.lessonIdx].screens[state.screenIdx];
  const c = screen.cards[carouselState.idx];
  if(carouselState.answers[carouselState.idx] !== null) return;
  const subKey = key()+'C'+carouselState.idx;
  if(btnIdx !== c.correctIndex){
    recordExerciseResult(subKey, false); // first wrong click locks this card's score as incorrect
    return;
  }
  carouselState.answers[carouselState.idx] = btnIdx;
  recordExerciseResult(subKey, true); // no-op if a wrong click already recorded this card
  addXp(5);
  const k = key();
  const allDone = carouselState.answers.every(a=>a!==null);
  if(allDone) state.answers[k] = true;
  renderLessonScreen();
}
function renderCarouselClassifyScreen(screen){
  const k = key();
  ensureCarouselState(screen, k);
  const idx = carouselState.idx;
  const c = screen.cards[idx];
  const answered = carouselState.answers[idx];
  const allDone = carouselState.answers.every(a=>a!==null);
  const inner = `
    ${playerHeader()}
    <div class="player-body">
      ${navBackHtml()}
      <div class="support-tab" onclick="toggleSupport()">Support</div>
      <div class="quickcheck-badge">🔄 CLASSIFY EACH ONE</div>
      <div class="qtext" style="text-align:center;margin-top:10px;">${screen.prompt}</div>
      <div class="carousel-progress">Card ${idx+1} of ${screen.cards.length}</div>
      <div class="carousel-row">
        <button class="carousel-nav" ${idx===0?'disabled':''} onclick="carouselNav(-1)">‹</button>
        <div class="carousel-card">${c.text}</div>
        <button class="carousel-nav" ${idx===screen.cards.length-1?'disabled':''} onclick="carouselNav(1)">›</button>
      </div>
      <div class="carousel-btn-row">
        ${screen.buttons.map((b,i)=>{
          let cls = '';
          if(answered!==null){
            if(i===c.correctIndex) cls='picked-correct';
            else cls='dim';
          }
          return `<button class="carousel-choice-btn ${cls}" onclick="pickCarouselAnswer(${i})">${b}</button>`;
        }).join('')}
      </div>
      <div class="ai-tutor-btn" onclick="toggleAiTutor()"><small>💡 HINT</small>Explain This Screen</div>
      ${answered!==null ? `
      <div class="tutor-callout green">
        <span class="tc-close" onclick="this.parentElement.style.display='none'">✕</span>
        ${c.feedback}
        ${!allDone ? `<div class="carousel-next-hint">Use ‹ › to go to the next card.</div>` : ''}
      </div>` : ''}
      ${answered!==null && allDone ? `<button class="btn-green" style="margin-top:14px;" onclick="nextScreen()">CONTINUE</button>` : ''}
    </div>
    ${supportModalHtml()}`;
  finalizeScreenHtml(inner);
}

/* ============ MATCH PAIRS (click-to-match, teal themed) ============ */
let matchPairsState = { forKey:null, rightOrder:[], selectedLeft:null, matched:[], wrongFlash:null };
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function ensureMatchPairsState(screen, k){
  if(matchPairsState.forKey !== k){
    matchPairsState = {
      forKey:k,
      rightOrder: shuffleArray(screen.pairs.map(p=>p.right)),
      selectedLeft: null,
      matched: [],
      wrongFlash: null
    };
  }
}
function clickMatchLeft(leftIdx){
  if(matchPairsState.matched.includes(leftIdx)) return;
  matchPairsState.selectedLeft = (matchPairsState.selectedLeft === leftIdx) ? null : leftIdx;
  matchPairsState.wrongFlash = null;
  renderLessonScreen();
}
function clickMatchRight(rightIdx){
  const screen = LESSONS[state.lessonIdx].screens[state.screenIdx];
  const rightText = matchPairsState.rightOrder[rightIdx];
  if(matchPairsState.selectedLeft === null) return;
  if(matchPairsState.matched.some(li=>screen.pairs[li].right===rightText)) return;
  const li = matchPairsState.selectedLeft;
  const subKey = key()+'P'+li;
  if(screen.pairs[li].right === rightText){
    matchPairsState.matched.push(li);
    matchPairsState.selectedLeft = null;
    matchPairsState.wrongFlash = null;
    recordExerciseResult(subKey, true); // no-op if a wrong attempt already recorded this pair
    addXp(5);
    const allDone = matchPairsState.matched.length === screen.pairs.length;
    if(allDone){ state.answers[key()] = true; }
  } else {
    recordExerciseResult(subKey, false); // first wrong attempt locks this pair's score as incorrect
    matchPairsState.wrongFlash = screen.tip || "Not quite — take another look and try again.";
    matchPairsState.selectedLeft = null;
  }
  renderLessonScreen();
}
function renderMatchPairsScreen(screen){
  const k = key();
  ensureMatchPairsState(screen, k);
  const allDone = matchPairsState.matched.length === screen.pairs.length;
  const inner = `
    ${playerHeader()}
    <div class="player-body">
      ${navBackHtml()}
      <div class="support-tab" onclick="toggleSupport()">Support</div>
      <div class="quickcheck-badge mp-badge">🔗 MATCH EACH PROMPT WITH AN ANSWER</div>
      <div class="qtext" style="margin-top:10px;">${screen.prompt}</div>
      <div class="match-cols">
        <div class="match-col">
          ${screen.pairs.map((p,i)=>{
            const isMatched = matchPairsState.matched.includes(i);
            const isSelected = matchPairsState.selectedLeft === i;
            return `<div class="match-cell ${isMatched?'matched':''} ${isSelected?'selected':''}" onclick="clickMatchLeft(${i})">${p.left}</div>`;
          }).join('')}
        </div>
        <div class="match-col">
          ${matchPairsState.rightOrder.map((rt,ri)=>{
            const isMatched = matchPairsState.matched.some(li=>screen.pairs[li].right===rt);
            return `<div class="match-cell ${isMatched?'matched':''}" onclick="clickMatchRight(${ri})">${rt}</div>`;
          }).join('')}
        </div>
      </div>
      ${matchPairsState.wrongFlash ? `<div class="match-tip">${matchPairsState.wrongFlash}</div>` : ''}
      <div class="ai-tutor-btn" onclick="toggleAiTutor()"><small>💡 HINT</small>Explain This Screen</div>
      ${allDone ? `<div class="continue-row"><button class="btn-green" onclick="nextScreen()">CONTINUE</button></div>` : ''}
    </div>
    ${supportModalHtml()}`;
  finalizeScreenHtml(inner);
}

/* ============ LESSON COMPLETE SCREEN ============ */
function goToNextLessonOrCourse(){
  const next = state.lessonIdx + 1;
  if(next < LESSONS.length){ startLesson(next); }
  else { renderCourse(); }
}
function giveLessonFeedback(thumb){
  state.lessonCompleteFeedback = thumb;
  renderLessonCompleteScreen();
}
function toggleFeedbackTag(tag){
  if(!state.feedbackTags) state.feedbackTags = new Set();
  if(state.feedbackTags.has(tag)) state.feedbackTags.delete(tag);
  else state.feedbackTags.add(tag);
  renderLessonCompleteScreen();
}
function renderLessonCompleteScreen(){
  const l = LESSONS[state.lessonIdx];
  const hasNext = state.lessonIdx + 1 < LESSONS.length;
  const nextTitle = hasNext ? LESSONS[state.lessonIdx+1].title : null;
  const tags = ["Fun","Fast","Challenging","Useful","Easy"];
  stageEl().innerHTML = `
    <div class="player-header" style="background:var(--pink);">
      <span class="exit-link" onclick="renderCourse()">← EXIT</span>
      <div class="progress-wrap"><div class="progress-caption">LESSON COMPLETE</div></div>
      <div class="header-right"><div>${l.title}</div><div class="lesson-of">Lesson ${state.lessonIdx+1} of ${LESSONS.length}</div></div>
    </div>
    <div class="lc-wrap">
      <div class="lc-card">
        <div class="lc-icon">🎉</div>
        <div class="lc-title">${l.title}</div>
        <div class="lc-label">KEY TERMS</div>
        <div class="lc-divider"></div>
        <div class="lc-terms">${(l.keyTerms||[]).map(t=>`<div>${t}</div>`).join('')}</div>
        <div class="lc-feedback-row">
          <span>Give feedback on this lesson</span>
          <span class="lc-thumb ${state.lessonCompleteFeedback==='up'?'active':''}" onclick="giveLessonFeedback('up')">👍</span>
          <span class="lc-thumb ${state.lessonCompleteFeedback==='down'?'active':''}" onclick="giveLessonFeedback('down')">👎</span>
        </div>
        ${state.lessonCompleteFeedback ? `
          <div class="lc-tags">
            <span class="lc-tags-label">Thanks! Why the thumbs ${state.lessonCompleteFeedback}?</span>
            <div class="lc-tag-row">
              ${tags.map(t=>`<button class="lc-tag ${state.feedbackTags && state.feedbackTags.has(t)?'active':''}" onclick="toggleFeedbackTag('${t}')">${t}</button>`).join('')}
            </div>
          </div>` : ''}
        <button class="btn-green lc-next-btn" onclick="goToNextLessonOrCourse()">
          ${hasNext ? `<small>NEXT LESSON:</small><br>${nextTitle} →` : `BACK TO COURSE →`}
        </button>
      </div>
    </div>`;
}

/* ============ CERTIFICATE OF COMPLETION ============ */
function updateCertName(val){
  state.certificateName = val;
  saveProgress();
  const printEl = document.getElementById('certNamePrint');
  if(printEl) printEl.textContent = val.trim() || 'Course Graduate';
}
function downloadCertificatePdf(){
  const input = document.getElementById('certNameInput');
  if(input) updateCertName(input.value);
  window.print();
}
function renderCertificateScreen(){
  const dateStr = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const nameVal = state.certificateName || '';
  stageEl().innerHTML = `
    <div class="cert-toolbar no-print">
      <span class="exit-link" onclick="renderCourse()">← BACK TO COURSE</span>
      <span class="cert-toolbar-title">🎓 Certificate of Completion</span>
    </div>
    <div class="cert-controls no-print">
      <label class="cert-name-label">Your name (for the certificate):</label>
      <input id="certNameInput" type="text" placeholder="Enter your full name" value="${nameVal.replace(/"/g,'&quot;')}" oninput="updateCertName(this.value)" />
      <button class="btn-green cert-download-btn" onclick="downloadCertificatePdf()">⬇ Download as PDF</button>
      <div class="cert-hint">This opens your browser's print dialog — choose <b>"Save as PDF"</b> as the destination (instead of a physical printer) to download it.</div>
    </div>
    <div class="cert-page">
      <div class="cert-border">
        <div class="cert-ribbon">🏅</div>
        <div class="cert-kicker">CERTIFICATE OF COMPLETION</div>
        <div class="cert-presented">This certifies that</div>
        <div class="cert-name" id="certNamePrint">${escapeHtml(nameVal.trim()) || 'Course Graduate'}</div>
        <div class="cert-presented">has successfully completed the course</div>
        <div class="cert-course-title">English Communication &amp; Grammar Mastery</div>
        <div class="cert-meta">11 Lessons · 4 Milestone Exams · Final Exam Passed</div>
        <div class="cert-footer">
          <div class="cert-sig-block">
            <div class="cert-sig-line">Quantic School of English</div>

            <div class="cert-sig-label">Date Completed</div>
          </div>
        </div>
      </div>
    </div>`;
}

renderCourse();
